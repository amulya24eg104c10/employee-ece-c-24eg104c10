<!DOCTYPE html>
<html>
<head>
<title>empX - Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif;}
body{background:#f5f5f7;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;}
.card{background:white;width:100%;max-width:420px;padding:35px 28px;border-radius:20px;box-shadow:0 8px 30px rgba(0,0,0,0.08);border:1px solid #eee;}
.logo{text-align:center;margin-bottom:10px;}
.logo h1{font-size:52px;font-weight:900;letter-spacing:-1px;color:#111;}
.logo h1 span{color:#4b2cff;}
.welcome{text-align:center;margin-top:15px;font-size:23px;font-weight:700;color:#111;}
.sub{text-align:center;color:#666;font-size:14px;margin:6px 0 26px;line-height:1.4;}
.sub b{color:#111;}
label{display:block;font-size:14px;font-weight:600;margin:16px 0 8px;color:#111;}
label span{color:red;}
.input{width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid #e0e0e0;background:#f6f5f9;font-size:15px;outline:none;transition:0.2s;}
.input:focus{border-color:#4b2cff;background:#fff;box-shadow:0 0 0 3px rgba(75,44,255,0.12);}
.input-purple{border-color:#8a7ac4;background:#fff;}
.pass-wrap{position:relative;}
.eye{position:absolute;right:14px;top:14px;cursor:pointer;user-select:none;}
.btn{width:100%;background:#2d1b69;color:white;padding:14px;border-radius:12px;border:0;font-size:16px;font-weight:600;margin-top:22px;cursor:pointer;}
.btn:hover{background:#1e124a;}
.forgot{text-align:right;margin-top:14px;}
.forgot a{color:#2d1b69;text-decoration:none;font-size:14px;font-weight:500;}
.divider{display:flex;align-items:center;gap:12px;margin:22px 0;color:#999;font-size:14px;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#e5e5e5;}
.social{width:100%;padding:13px;border-radius:12px;border:0;background:#f5f5f7;margin-top:12px;display:flex;justify-content:center;align-items:center;gap:8px;font-size:15px;font-weight:500;cursor:pointer;}
</style>
</head>
<body>
<div class="card">
<div class="logo"><h1>emp<span>X</span></h1></div>
<div class="welcome">Welcome back</div>
<div class="sub">Sign in to continue to <b>Employee Management System</b></div>

<label><span>*</span>Username or email</label>
<input class="input input-purple" id="user" placeholder="Enter username or email">

<label><span>*</span>Password</label>
<div class="pass-wrap">
<input class="input" id="pass" type="password" placeholder="Enter password">
<span class="eye" onclick="togglePass()">👁️</span>
</div>

<button class="btn" onclick="login()">Sign in</button>
<div class="forgot"><a href="#">Forgot password?</a></div>
<div class="divider">or</div>
<button class="social">🔵 Sign in with Google</button>
<button class="social">🟦 Sign in with Microsoft</button>
</div>

<script>
function togglePass(){
 let p=document.getElementById("pass");
 p.type=p.type==="password"?"text":"password";
}
function login(){
 let u=document.getElementById("user").value.trim();
 let p=document.getElementById("pass").value.trim();
 if(!u||!p){alert("Please enter username and password");return;}
 localStorage.setItem("empUser",u);
 window.location.href="dashboard.html";
}
</script>
</body>
</html>
